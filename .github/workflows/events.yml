# Check the Surf Coast Events calendar and add what's new, unverified.
#
# Cadence: Monday and Thursday, 7am Melbourne time.
#
# The number that sets this is 9 — the shortest notice anything on that site has
# ever been published with (measured across every listing, Aug 2026; only two
# were under a fortnight). Checking twice a week means the worst case is hearing
# about an event five days before it happens, and a missed run still leaves days
# in hand. Daily would be seven times the runs for margin nobody needs; the
# calendar is edited about thirty times a week, though, so less than weekly
# would let dates drift out of the database unnoticed.
#
# GitHub cron is UTC and does not follow daylight saving, so this drifts to 8am
# over summer. That does not matter for a job nobody is waiting on.
name: Surf Coast events

on:
  schedule:
    - cron: '0 21 * * 0,3'    # Sun/Wed 21:00 UTC = Mon/Thu 07:00 AEST
  workflow_dispatch:           # and whenever you press the button

permissions:
  contents: write              # to commit events_seen.json back

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Each scraper records its own exit code and lets the job continue. One
      # source being down is not a reason to skip the other, and the job is
      # still failed at the end — see "Fail the job if either scraper crashed".
      # pipefail, or `tee` succeeding masks a crash in the script and the job
      # goes green on a total failure. 2>&1 so a traceback reaches the record
      # instead of vanishing.
      - name: Look, and add anything new as unverified
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # +e because GitHub runs this under `bash -e`, which would abort the
          # step on a crash before the exit code was ever written down. pipefail
          # so `tee` succeeding cannot mask that crash.
          set +e -o pipefail
          python3 scripts/scrape_events.py --write 2>&1 | tee run.txt
          echo "$?" > run.rc
          exit 0

      - name: Read each venue's own ticketing page
        if: always()
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e -o pipefail
          python3 scripts/scrape_venues.py --write 2>&1 | tee venues.txt
          echo "$?" > venues.rc
          exit 0

      # The job summary below is a page on github.com nobody visits. This is the
      # same information written into the repo, where the back-of-house page can
      # read it off raw.githubusercontent.com without a token or a redeploy.
      - name: Record what this run did
        if: always()
        run: python3 scripts/run_log.py

      - name: Put the run in the job summary
        if: always()
        run: |
          {
            echo '## Surf Coast Events calendar'
            echo '```'
            cat run.txt 2>/dev/null || echo 'produced nothing — check the step above'
            echo '```'
            echo '## Venue ticketing pages'
            echo '```'
            cat venues.txt 2>/dev/null || echo 'produced nothing — check the step above'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # always(), because a crashed run is exactly the one worth having on file.
      - name: Remember what was offered
        if: always()
        run: |
          git config user.name  'events bot'
          git config user.email 'noreply@github.com'
          git add scripts/events_seen.json scripts/venues_seen.json scripts/run_log.json
          git diff --cached --quiet && { echo 'nothing new to remember'; exit 0; }
          # [skip ci] because the site reads Supabase live, and the back-of-house
          # page reads this log from raw.githubusercontent — neither needs a build.
          git commit -m "Events: remember this week's listings [skip ci]"

          # A full run takes about fifteen minutes, so main can easily move
          # underneath it — and since the run log is committed on nearly every
          # run now, a plain push loses that race often rather than rarely.
          # It happened on the first real run of this workflow (25 Aug 2026):
          # both scrapers succeeded, the database was written, and the whole job
          # went red on `! [rejected] main -> main (fetch first)`.
          #
          # These three files are append-only ledgers, so rebasing on top of
          # whatever landed is the right move. A conflict is not — it means two
          # runs raced or somebody hand-edited a ledger, and quietly picking a
          # side would drop a record. Fail loudly instead.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected — main moved; rebasing and trying again"
            git pull --rebase --autostash origin main || {
              echo "rebase hit a conflict in the ledgers — not guessing which side wins"
              exit 1
            }
          done
          echo "could not push the ledgers after three attempts"
          exit 1

      - name: Fail the job if either scraper crashed
        if: always()
        run: |
          rc1=$(cat run.rc    2>/dev/null || echo 1)
          rc2=$(cat venues.rc 2>/dev/null || echo 1)
          echo "scrape_events.py exited $rc1, scrape_venues.py exited $rc2"
          [ "$rc1" = 0 ] && [ "$rc2" = 0 ]
