  --ground:#EAEAEA; --surface:#E1E2DC; --ink:#1B2114; --ink2:#4A5142; --ink3:#787E6E;
  --rule:#CFD0C9; --rule2:#B9BBB2;
  --serif:'Sunset',Georgia,'Times New Roman',serif;
  --util:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pad:64px; --ctrl-invert:none;
  /* where a row's two marks sit: the icon's ink in from the left edge, the pin's
     out from the right. The list bleeds past the page margin, so these hang
     inside it — one number moves both ends. */
  --gut:60px;
  --tint-l:.905; --tint-c:.115;
  --accent:#FFBB02;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14170F; --surface:#1E2218; --ink:#E5E7DE; --ink2:#B1B6A7; --ink3:#7F8678;
  --rule:#2C3126; --rule2:#3C4234; --ctrl-invert:invert(.92);
  --tint-l:.355; --tint-c:.082;
}}
:root[data-theme="dark"]{
  --ground:#14170F; --surface:#1E2218; --ink:#E5E7DE; --ink2:#B1B6A7; --ink3:#7F8678;
  --rule:#2C3126; --rule2:#3C4234; --ctrl-invert:invert(.92);
  --tint-l:.355; --tint-c:.082;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.page{padding:0 var(--pad) 120px}

/* the title takes the row, the pill takes its right-hand end, and the date
   line runs the full width underneath rather than being squeezed by the pill */
header{padding:44px 0 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;
  align-items:start;column-gap:18px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,6vw,76px);letter-spacing:-.025em;line-height:.95;margin:0}
.srcbadge{font-family:var(--util);font-size:9.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);border:1px solid var(--rule2);padding:1px 6px;margin-left:10px}
.sub{grid-column:1/-1;margin-top:14px;font-family:var(--util);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ── what you have kept, counted, top right ──
   An outline pill so it reads as a tally rather than a button to press first;
   it fills in only while it is holding the list down to what you saved. */
.hdrbtns{grid-column:2;grid-row:1;justify-self:end;margin-top:9px;
  display:flex;align-items:center;gap:10px}
.savedpill,.modepill{
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  font-family:var(--util);font-size:12.5px;font-weight:600;letter-spacing:.06em;
  color:var(--ink2);background:transparent;border:1px solid var(--rule2);
  border-radius:999px;padding:8px 15px;cursor:pointer;
}
.savedpill:hover,.modepill:hover{border-color:var(--ink);color:var(--ink)}
/* The word rather than a sun-and-moon glyph. There are three states, which do
   not reduce to two symbols, and a cycling icon button makes the reader guess
   what the next press will do. */
.modepill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.modepill b{font-weight:600;letter-spacing:.06em}
.savedpill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.savedpill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.savedpill b{font-weight:600;font-variant-numeric:tabular-nums}
.savedpill.empty{color:var(--ink3)}
/* grey until it is holding something, so the count and the colour say the same thing */
.savedpill .ic{font-size:14px;line-height:1;filter:grayscale(1);opacity:.75}
.savedpill:not(.empty) .ic{filter:none;opacity:1}

/* ── controls: dropdowns only ── */
.controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;padding-bottom:26px}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:0}
select,input[type=search]{
  font-family:var(--serif);font-size:17px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--rule2);padding:5px 26px 6px 0;min-width:150px;
  border-radius:0;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 9px) calc(50% + 1px),calc(100% - 4px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
input[type=search]{background-image:none;padding-right:4px;cursor:text}
input[type=search]::placeholder{color:var(--ink3)}
select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
select:hover,input[type=search]:hover{border-bottom-color:var(--ink)}
option{background:var(--ground);color:var(--ink)}
.clearbtn{
  font-family:var(--serif);font-size:17px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--ink);padding:5px 0 6px;cursor:pointer;white-space:nowrap;
}
.clearbtn:hover{color:var(--ink2);border-bottom-color:var(--ink2)}
.clearbtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── multi-select: several answers to one question, which a native select can
      only do as a listbox. The button reads as the other controls do. ── */
.ms{position:relative}
.ms-btn{
  font-family:var(--serif);font-size:17px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--rule2);padding:5px 26px 6px 0;min-width:132px;
  text-align:left;cursor:pointer;white-space:nowrap;position:relative;border-radius:0;
}
.ms-btn::after{content:"";position:absolute;right:6px;bottom:11px;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid currentColor;opacity:.8}
.ms-btn:hover,.ms-btn[aria-expanded="true"]{border-bottom-color:var(--ink)}
.ms-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ms-btn.on{font-style:italic}
.ms-pop{
  position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:212px;
  max-height:min(58vh,420px);overflow-y:auto;padding:8px 0;
  background:var(--ground);border:1px solid var(--rule2);
  box-shadow:0 6px 26px rgba(0,0,0,.22);
}
.ms-pop[hidden]{display:none}
.ms-pop label{
  display:flex;align-items:center;gap:10px;padding:7px 15px;cursor:pointer;
  font-family:var(--serif);font-size:16px;color:var(--ink);white-space:nowrap;
}
.ms-pop label .n{margin-left:auto;padding-left:14px;font-family:var(--util);font-size:11px;
  color:var(--ink3);font-variant-numeric:tabular-nums}
.ms-pop label:hover{background:var(--surface)}
/* `.off` used to grey out an option that would return nothing. Those are left
   out of the menu now, so there is nothing to grey. */
.ms-none{margin:0;padding:9px 15px;font-family:var(--serif);font-size:14px;
  font-style:italic;color:var(--ink3);white-space:normal;max-width:22em}
.ms-pop input{accent-color:var(--ink);width:14px;height:14px;flex:none;margin:0}
.ms-clear{
  display:block;width:100%;text-align:left;padding:7px 15px;margin-top:4px;
  border:0;border-top:1px solid var(--rule);background:transparent;cursor:pointer;
  font-family:var(--util);font-size:10.5px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink3);
}
.ms-clear:hover{color:var(--ink)}

/* ── the four secondary filters, folded away until asked for ── */
.morebtn{
  font-family:var(--serif);font-size:17px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--rule2);padding:5px 0 6px;cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
}
.morebtn:hover,.morebtn[aria-expanded="true"]{border-bottom-color:var(--ink)}
.morebtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.morebtn .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}
.more{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;padding:0 0 26px}
.more[hidden]{display:none}

/* ── sort / view / search belong to the list, not to the filters ── */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding-bottom:12px}
/* the listing area has a name, and its count belongs beside it rather than
   floating loose at the end of a row of controls */
.board{margin:0 auto 0 0;font-family:var(--serif);font-weight:400;font-size:17px;
  line-height:1.3;letter-spacing:-.005em;color:var(--ink);white-space:nowrap}
.board span{color:var(--ink3);font-variant-numeric:tabular-nums}
.toolbar input[type=search]{min-width:0;width:150px;transition:width .16s}
.toolbar input[type=search]:focus{width:212px}

/* ── what is currently on, and one click to take it off again ── */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 22px}
.chips:empty{display:none}
.chip{
  font-family:var(--util);font-size:12px;font-weight:500;letter-spacing:.02em;
  color:var(--ground);background:var(--ink);border:1px solid var(--ink);
  border-radius:999px;padding:5px 8px 5px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
.chip:hover{background:var(--ink2);border-color:var(--ink2)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip .x{font-size:13px;line-height:1;opacity:.7}
.chip:hover .x{opacity:1}

/* ── Add is a standing offer, not a filter ── */
.addpill{
  position:fixed;right:24px;bottom:24px;z-index:40;
  font-family:var(--util);font-size:13px;font-weight:600;letter-spacing:.06em;
  color:var(--ground);background:var(--ink);border:0;border-radius:999px;
  padding:13px 22px;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.28);
}
.addpill:hover,.addpill[aria-expanded="true"]{background:var(--ink2)}
.addpill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── add panel ── */
.addbtn{
  font-family:var(--serif);font-size:17px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--ink);padding:5px 0 6px;cursor:pointer;white-space:nowrap;
}
.addbtn:hover{color:var(--ink2);border-bottom-color:var(--ink2)}
.addbtn:focus-visible,.clearbtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.panel{display:none;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule2);
  padding:30px 0 34px;margin-bottom:34px}
.panel.open{display:block}
.panel h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 4px;letter-spacing:-.015em}
.panel .lede{font-family:var(--util);font-size:12.5px;color:var(--ink3);margin:0 0 22px;max-width:70ch;line-height:1.7}
.kind{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--rule2);width:max-content;max-width:100%}
.kind button{font-family:var(--serif);font-size:16px;padding:9px 20px;border:0;border-right:1px solid var(--rule2);
  background:transparent;color:var(--ink2);cursor:pointer}
.kind button:last-child{border-right:0}
.kind button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px 28px;max-width:1200px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-family:var(--util);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.fld input,.fld select,.fld textarea{
  font-family:var(--serif);font-size:16px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--rule2);padding:5px 0 6px;width:100%;border-radius:0}
.fld textarea{resize:vertical;min-height:52px;line-height:1.5}
.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink3)}
.fld.wide{grid-column:1/-1;max-width:74ch}
.fld.lead{order:-1;grid-column:1/-1;max-width:74ch}
.acts{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-top:26px}
.acts .msg{font-family:var(--util);font-size:12px;color:var(--ink3);flex:1 1 200px;line-height:1.6}
.mine{font-family:var(--util);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  border:1px solid var(--rule2);padding:1px 5px;margin-left:8px;white-space:nowrap}


.fld.sug input,.fld.sug select,.fld.sug textarea{border-bottom-style:dashed;border-bottom-color:var(--ink2)}
.fld.sug label::after{content:" · drafted";color:var(--ink3);letter-spacing:.08em}
.review{display:none;margin-top:22px;padding:16px 18px;background:var(--surface);border-left:2px solid var(--ink2)}
.review.on{display:block}
.review h3{font-family:var(--util);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.review p{margin:0 0 10px;font-size:15px;line-height:1.6;color:var(--ink2);max-width:74ch}
.review ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px}
.review li a{font-family:var(--util);font-size:12px;color:var(--ink2);text-decoration:none;
  border-bottom:1px solid var(--rule2)}
.review li a:hover{border-bottom-color:var(--ink)}
.warn{font-family:var(--util);font-size:12px;color:var(--ink3);margin-top:8px}


/* ── table ── */
.tbl{border-top:1px solid var(--ink);margin:0 calc(var(--pad) * -1)}
.rowline{
  display:grid;
  grid-template-columns:48px minmax(0,1fr) 92px 200px 132px 140px;
  gap:0 24px;align-items:center;
}

/* ── the type icon, in the row's left gutter ──
   The slot is always drawn, even when the type has no icon: an empty cell keeps
   every name on the same left edge, which a collapsing column would not.
   The artwork is a <use> of a <symbol> declared once at the top of the page. */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.c-icon{width:48px;display:grid;place-items:center end;color:var(--ink3)}
/* ── colour only on hover ──
   At rest every icon is one grey, whether its artwork is one colour or two, so
   a list of 400 rows is not a field of yellow. Hovering a row brings the ink up
   and lets the accent through.

   The accent is an inline fill on the path (see below), which no rule here can
   override — but it is a var() lookup, so swapping what the variable *means*
   per state does the job without touching the path. At rest it resolves to
   currentColor and the icon collapses to the single grey; on hover it resolves
   to the brand colour. The yellow itself still lives in one place, --accent. */
.c-icon{--icon-accent:currentColor}
.rowhead:hover .c-icon,.rowhead.saved .c-icon{--icon-accent:var(--accent)}
/* A fixed box, not a fixed width. The set is not one proportion — the skateboard
   is 3:1 and the coffee cup is taller than it is wide — so sizing on width alone
   would make an upright icon 60px tall and push the row open. Each <symbol>
   carries its own viewBox and scales to fit inside 48x28, centred. */
/* ── 24px means 24px of white, not 24px of box ──
   The 48x28 box is a container, not the artwork: a narrow icon centred in it
   left 7px of air on each side, so the gap the eye measured between a runner
   and its name was ~33px while the skateboard's was 26. The box now sits at the
   slot's inner edge (place-items:center end) and each <symbol> right-aligns its
   own artwork inside it (preserveAspectRatio="xMaxYMid"), so every icon's ink
   ends on one line, 24px from the name — the column gap and nothing else.
   The slot stays 51px whether or not it holds anything, which is still what
   keeps every name on the same left edge. */
.c-icon svg{width:48px;height:28px;fill:currentColor;display:block}
/* Some of the set is two-colour. The black in those files is the ink and follows
   the row like the single-colour icons do; the brand yellow is the accent.

   The accent is set inline on the path rather than by a rule here, and that is
   not laziness: <use> clones the symbol into a shadow tree, which a selector in
   this stylesheet cannot reach — `.c-icon .accent{}` matches nothing. An inline
   style is part of what gets cloned, and `--icon-accent` still reaches it
   because custom properties inherit across the boundary. So the colour is still
   one token in one place, it just has to be spent through var(). */
.rowhead:hover .c-icon,.rowhead.saved .c-icon{color:var(--ink)}

.rec{border-bottom:1px solid var(--rule)}

/* ── keep this one ──
   The pin sits in the row's right-hand gutter, as a sibling of the row button
   and never inside it: a button within a button is invalid markup and eats the
   row's own click. Hidden until the row is hovered, and it stays once it is on.
   A touch screen has no hover, so there it is always showing.

   Both ends of a row leave the same white space. The mark is aligned to the end
   of the button rather than centred in it, so what lands on the page margin is
   the pin itself and not a box around it — an emoji's advance width is not the
   same on every platform, and a fixed offset would only be true on this one. The
   36px hit area then runs inwards, into the gutter the row's padding keeps clear. */
.rowhead{position:relative}
.savebtn{
  position:absolute;top:0;bottom:0;right:var(--gut);
  width:36px;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center end;font-size:15px;line-height:1;
  opacity:0;filter:grayscale(1);transition:opacity .13s,filter .13s;
}
.rowhead:hover .savebtn,.savebtn:focus-visible{opacity:.5}
.savebtn:hover{opacity:.85}
.savebtn.on,.rowhead:hover .savebtn.on{opacity:1;filter:none}
.savebtn:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
@media (hover:none){.savebtn{opacity:.45}}
/* ── the press ──
   A pin goes into a board along its own needle, and the 📌 points down-left, so
   that is the direction this one travels. It shrinks as it goes in — going away
   from you, not getting smaller — and the board gives a little back on the way
   out. The overshoot is what reads as "in": the travel itself is two pixels at
   this size and would pass for a wobble on its own.
   Pulling one out is the same move reversed and shorter. Taking something off a
   list is not an occasion.
   The animation is on a span inside the button, not the button: the button is
   the 36px hit area and the thing that moves should be the mark. */
.savebtn .glyph{display:block;transition:transform .12s}
.savebtn:active .glyph{transform:translate(-1px,1px) scale(.84)}
.savebtn.press .glyph{animation:pin-in .34s cubic-bezier(.2,.7,.3,1)}
.savebtn.unpress .glyph{animation:pin-out .24s ease-out}
@keyframes pin-in{
  0%  {transform:translate(0,0) scale(1)   rotate(0)}
  38% {transform:translate(-2px,2px) scale(.66) rotate(-12deg)}
  68% {transform:translate(0,0) scale(1.14) rotate(4deg)}
  100%{transform:translate(0,0) scale(1)   rotate(0)}
}
@keyframes pin-out{
  0%  {transform:translate(0,0) scale(1) rotate(0)}
  45% {transform:translate(2px,-2px) scale(1.1) rotate(9deg)}
  100%{transform:translate(0,0) scale(1) rotate(0)}
}
/* the page-wide reduced-motion rule turns off transitions; these are animations */
@media (prefers-reduced-motion:reduce){.savebtn .glyph{animation:none!important}}
/* Unpinning inside the saved view takes the row with it, so the row fades while
   the pin comes out and the list redraws after both. */
.rec.leaving{opacity:.2;transition:opacity .26s}

.rowline{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;
  cursor:pointer;min-height:57px;
  /* the extra 40 on the right is the pin's lane: the mark itself sits on the
     margin like the icon does, and the text stops ~24px short of it, which is
     the same gap the icon keeps from the name at the other end */
  padding:11px calc(var(--gut) + 40px) 11px var(--gut)}
/* ── the hover colourway ──
   A row lights up in its own theme's colour, so running the eye down the list
   the colour says what kind of thing it is before the type column is read.

   Two numbers set the whole set. oklch is here for a reason and not decoration:
   its lightness is perceptual, so every hue lands at the same brightness. The
   same twelve colours written in hsl would give a yellow that reads almost
   white and a blue that reads nearly black at identical numbers, and the list
   would look like some rows were shouting.

   Light needs a pale wash under near-black ink, dark a deep one under near-
   white, so the pair is redefined per scheme and the twelve hues are not. */
.rowhead{--tint:var(--surface)}
/* Nine groups, nine hues 40 degrees apart. oklch keeps them all the same
   perceptual brightness, so no row shouts louder than its neighbour. */
.rowhead[data-tint="hospitality"]{--tint:oklch(var(--tint-l) var(--tint-c)  30)}
.rowhead[data-tint="produce"]    {--tint:oklch(var(--tint-l) var(--tint-c)  70)}
.rowhead[data-tint="outdoors"]   {--tint:oklch(var(--tint-l) var(--tint-c) 110)}
.rowhead[data-tint="landscape"]  {--tint:oklch(var(--tint-l) var(--tint-c) 150)}
.rowhead[data-tint="ocean"]      {--tint:oklch(var(--tint-l) var(--tint-c) 190)}
.rowhead[data-tint="home"]       {--tint:oklch(var(--tint-l) var(--tint-c) 230)}
.rowhead[data-tint="arts"]       {--tint:oklch(var(--tint-l) var(--tint-c) 270)}
.rowhead[data-tint="music"]      {--tint:oklch(var(--tint-l) var(--tint-c) 310)}
.rowhead[data-tint="community"]  {--tint:oklch(var(--tint-l) var(--tint-c) 350)}
/* An unsorted row has no theme, keeps no data-tint, and falls back to --surface
   above — the grey it has always had. */
/* A pinned row keeps the hover look for good — its theme colour and its icon in
   colour — so what you have saved is picked out of the list without hovering
   anything. This is also the one place the colour reaches a touch screen, where
   there is no hover at all. */
.rowline:hover,.rowhead:hover .rowline,.rowhead.saved .rowline{background:var(--tint)}
.rowline:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.c-name{font-size:20px;letter-spacing:-.01em;line-height:1.2}
.c-type,.c-where,.c-when,.c-cost,.c-extra,.tm,.c-name .nm{
  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* the name clips, the unverified badge does not — it is the row's only warning */
.c-name{display:flex;align-items:center;gap:8px;min-width:0}
.c-name .mine{flex:none}
.c-type,.c-where,.c-when,.c-cost{font-size:14px;color:var(--ink2);line-height:1.22}
.c-extra{font-size:14px;color:var(--ink2);line-height:1.22;min-width:0}
.est{font-family:var(--util);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:block;margin-top:3px}
.tm{display:block;font-family:var(--serif);font-size:12px;color:var(--ink3);line-height:1.25;margin-top:1px}
/* How often it repeats, beside the day — "Saturday" alone reads as one Saturday. */
.rep{font-family:var(--util);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);margin-left:7px;white-space:nowrap}
.mob{display:none}

.detail{display:none;padding:2px var(--pad) 30px}
.rec.open .detail{display:block}
.detail-in{display:grid;grid-template-columns:minmax(0,3.1fr) minmax(0,2.5fr);gap:28px 28px;max-width:1400px}
.detail p{margin:0 0 14px;font-size:17px;line-height:1.62;color:var(--ink2);max-width:66ch}
.dl{margin:0;font-family:var(--util);font-size:12px;line-height:1.75;color:var(--ink3)}
.dl b{display:block;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--ink3);margin-bottom:5px}
.dl span{color:var(--ink2)}
.links{display:flex;flex-wrap:wrap;gap:22px;margin-top:6px}
.links a{font-family:var(--serif);font-size:16px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule2);padding-bottom:1px}
.links a:hover{border-bottom-color:var(--ink)}
.none{padding:80px 0;text-align:center;color:var(--ink3);font-size:20px}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);font-family:var(--util);font-size:11.5px;line-height:1.8;color:var(--ink3);max-width:78ch}

/* ── list / map switch ── */
.seg{display:flex;border:1px solid var(--rule2);width:max-content;max-width:100%}
.seg button{font-family:var(--serif);font-size:16px;line-height:1.2;padding:6px 17px 7px;border:0;
  border-right:1px solid var(--rule2);background:transparent;color:var(--ink2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── map ── */
#mapwrap{display:none}
body.mapview #mapwrap{display:block}
body.mapview .tbl{display:none}
#map{height:min(72vh,640px);width:100%;background:var(--surface);border-top:1px solid var(--ink)}
.mapnote{font-family:var(--util);font-size:11.5px;line-height:1.75;color:var(--ink3);
  margin:0;padding:11px 0 0;border-top:1px solid var(--rule)}
.mapnote b{font-weight:600;color:var(--ink2)}
.mapstate{display:grid;place-items:center;height:100%;text-align:center;padding:0 24px;
  font-family:var(--serif);font-size:19px;color:var(--ink3);line-height:1.5}

/* A pin is the page's own mark, not a map library's balloon. */
/* No `position` here. MapLibre positions its own markers absolutely, this page's
   stylesheet now loads first and would win — and a marker set to `relative` drops
   out of the map and stacks down the page in document order. */
.pin{width:13px;height:13px;border-radius:50%;background:var(--ground);
  border:1.5px solid var(--ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ground) 65%,transparent)}
/* the mark stays small; the thing you can hit with a thumb does not */
.pin::before{content:'';position:absolute;inset:-10px}
.pin:hover,.pin.on{background:var(--ink)}
.pin b{font-family:var(--util);font-size:9px;font-weight:600;color:var(--ink);line-height:1}
.pin:hover b,.pin.on b{color:var(--ground)}
.pin.multi{width:20px;height:20px}
.pin.home{width:9px;height:9px;background:var(--ink);border-color:var(--ink);cursor:default;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--ground) 65%,transparent)}

.maplibregl-popup-content{background:var(--ground);color:var(--ink);border:1px solid var(--ink);
  border-radius:0;box-shadow:none;padding:15px 17px 16px;font-family:var(--serif);max-width:290px}
.maplibregl-popup-tip{display:none}
.maplibregl-popup-close-button{font-family:var(--util);font-size:17px;line-height:1;color:var(--ink3);
  background:none;padding:5px 8px 6px;right:0;top:0}
.maplibregl-popup-close-button:hover{background:none;color:var(--ink)}
.pop{max-height:270px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--rule2) transparent}
.pop::-webkit-scrollbar{width:5px}
.pop::-webkit-scrollbar-thumb{background:var(--rule2)}
.pop::-webkit-scrollbar-track{background:transparent}
.pop h4{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:-.01em;line-height:1.2;
  margin:0 0 4px;padding-right:16px}
.pop h4~h4{margin-top:15px;padding-top:13px;border-top:1px solid var(--rule)}
.pop .meta{font-family:var(--util);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 7px}
.pop p.txt{margin:0 0 9px;font-size:15px;line-height:1.5;color:var(--ink2)}
.pop a{font-family:var(--util);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
  text-decoration:none;border-bottom:1px solid var(--rule2);margin-right:15px;white-space:nowrap}
.pop a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.maplibregl-ctrl-group{border-radius:0!important;box-shadow:none!important;border:1px solid var(--rule2);
  background:var(--ground)}
.maplibregl-ctrl-group button{border-radius:0!important;background:var(--ground)}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--rule2)}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:var(--ctrl-invert)}
.maplibregl-ctrl-attrib{font-family:var(--util);font-size:10px;
  background:color-mix(in srgb,var(--ground) 82%,transparent)!important}
.maplibregl-ctrl-attrib a,.maplibregl-ctrl-attrib{color:var(--ink3)}
.maplibregl-ctrl-scale{font-family:var(--util);font-size:10px;border-radius:0;color:var(--ink3);
  border-color:var(--rule2);background:color-mix(in srgb,var(--ground) 82%,transparent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1180px){
  .rowline{grid-template-columns:51px minmax(0,1fr) 190px 128px 136px}
  .c-type{display:none}
}
@media (max-width:940px){
  .rowline{grid-template-columns:51px minmax(0,1fr) 180px 128px}
  .c-extra{display:none}
  .detail-in{grid-template-columns:1fr}
}
@media (max-width:700px){
  :root{--pad:20px; --gut:20px}
  /* stacked, so a fixed height and a clipped name both stop making sense */
  .rowline{grid-template-columns:48px 1fr;gap:3px 12px;min-height:0;align-items:start;
    padding:11px calc(var(--gut) + 40px) 11px var(--gut)}
  .c-icon{grid-row:1;margin-top:3px}
  .c-name{grid-column:2}
  header{padding:26px 0 30px}
  .c-name{display:block}
  .c-name .nm{white-space:normal;overflow:visible;text-overflow:clip;display:inline}
  .c-where,.c-when{display:none}
  .mob{display:block;grid-column:2;font-family:var(--util);font-size:12px;color:var(--ink3)}
  .controls{gap:12px 18px}
  select,input[type=search]{min-width:0;width:100%;font-size:16px}
  .ctrl{flex:1 1 42%}
  #map{height:min(76vh,560px)}
  .seg button{padding:6px 13px 7px;font-size:15px}
}
</style>

</head>

async function insertRemote(table, row){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+table,
    {method:'POST', headers:{...sbHeaders(), Prefer:'return=representation'},
     body:JSON.stringify(row)});
  if(!r.ok){ throw new Error((await r.text()).slice(0,200) || r.status); }
  return (await r.json())[0];
}

/* Real conditions when the host allows an outbound call (self-hosted); on claude.ai the
   page's CSP blocks it, so this silently stays unavailable and the manual options stand in. */
async function fetchWeather(){
  const u='https://api.open-meteo.com/v1/forecast?latitude=-38.34456&longitude=144.29517'
    +'&current=temperature_2m,precipitation,wind_speed_10m,cloud_cover'
    +'&daily=precipitation_sum&past_days=2&forecast_days=1&timezone=Australia%2FMelbourne';
  const c=new AbortController(), t=setTimeout(()=>c.abort(),5000);
  try{
    const r=await fetch(u,{signal:c.signal}); clearTimeout(t);
    if(!r.ok) return null;
    const j=await r.json();
    const past=(j.daily?.precipitation_sum||[]).slice(0,2).reduce((a,b)=>a+(b||0),0);
    return {temp:j.current.temperature_2m,wind:j.current.wind_speed_10m,
            rain:j.current.precipitation,rain48:past,cloud:j.current.cloud_cover};
  }catch(e){ clearTimeout(t); return null; }
}
const S={when:'any',group:[],type:[],suburb:[],km:999,cost:[],who:[],wx:'',sort:'when',q:'',saved:false};

/* ══ what you kept ══════════════════════════════════════════
   A wishlist with no account behind it. The keys live in this browser and
   nowhere else — no sign-in, nothing about you leaves the page — which also
   means it does not follow you to your phone, and clearing the browser clears
   it. Ids collide across the two tables (activity 83 and event 83 are
   different things), so a key carries its table letter with it. */
const SAVEKEY='notice.saved';
const keyOf = i => (i.ev?'e':'a')+i.id;
let SAVED=new Set();
try{ SAVED=new Set(JSON.parse(localStorage.getItem(SAVEKEY)||'[]')) }catch(e){}
const isSaved = i => SAVED.has(keyOf(i));
function toggleSaved(k){
  SAVED.has(k) ? SAVED.delete(k) : SAVED.add(k);
  /* Private browsing refuses to write. The pin still works for this visit —
     it just will not be there next time, which beats not working at all. */
  try{ localStorage.setItem(SAVEKEY, JSON.stringify([...SAVED])) }catch(e){}
}
function syncSavedPill(){

/* ── local time on the Surf Coast, wherever the viewer happens to be ── */
const melbNow=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Australia/Melbourne'}));
/* Jan Juc itself: the origin every `km` is measured from, the map's home mark and
   the point the sunset is computed for. Geocoded via OpenStreetMap (administrative
   centroid of the suburb). The value that stood here until 24 Aug 2026 —
   -38.3657,144.2979 — was 2.3 km offshore, in Bass Strait, and a dozen listings had
   been pinned to it. Check a coordinate against a basemap before trusting it. */
const JJ={lat:-38.34456,lng:144.29517};
/* Sunrise/sunset for Jan Juc. Standard hour-angle solution — good to a couple of minutes,
   which is all a "is it dark yet" question needs, and it costs no network call. */
function sunHours(d){
  const N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5), rad=Math.PI/180;
  const decl=-Math.asin(0.39779*Math.cos(rad*(0.98565*(N+10)+1.914*Math.sin(rad*0.98565*(N-2)))));
  const lat=JJ.lat*rad;
  const cosH=(Math.cos(90.833*rad)-Math.sin(lat)*Math.sin(decl))/(Math.cos(lat)*Math.cos(decl));
  if(cosH>1) return {rise:null,set:null};        /* polar night — never here, but be safe */
  if(cosH<-1) return {rise:0,set:24};
  const H=Math.acos(cosH)/rad;
  const B=2*Math.PI*(N-81)/364;
  const eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
  const tz=10+(isDST(d)?1:0);
  const noon=12-(JJ.lng-15*tz)/15-eot/60;
  return {rise:noon-H/15, set:noon+H/15};
}
/* Victorian DST: first Sunday in October to first Sunday in April. */
function isDST(d){
  const y=d.getFullYear(), nth=(mo,dow,n)=>{const x=new Date(y,mo,1);
    x.setDate(1+((dow-x.getDay()+7)%7)+7*(n-1)); return x;};
  return d>=nth(9,0,1) || d<nth(3,0,1);
}
const hhmm=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);
  const d=new Date(2000,0,1,H,M); return d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).toLowerCase()};

/* Roughly how long a thing takes, so we don't offer a full-day walk at dusk. */
function hoursNeeded(d){
  const s=String(d||'').toLowerCase();
  if(/overnight/.test(s)) return 0;            /* camping — daylight left is not the constraint */
  if(/full-day/.test(s))  return 4.5;
  if(/half-day/.test(s))  return 2.5;
  if(/1hr|hour/.test(s))  return 1;
  return 1.5;
}
/* When a listing is worth doing. Activities have no opening hours, so this is by kind. */
const NIGHTABLE=new Set(['night','cinema','at-home','cafe','camping','gig']);
function dayparts(i){
  if(i.dbDaypart) return i.dbDaypart==='both' ? ['day','night'] : [i.dbDaypart];
  if(i.added && !i.ev){                       /* the person adding it told us */
    if(i.anyTime)   return ['day','night'];
    if(i.nightOnly) return ['night'];
    return ['day'];
  }
  /* Read every type, not just the first: a glow-worm walk is `night` and `walk`,
     and whichever way round they are written it is still a night thing. */
  const ts=typesOf(i);
  if(ts.includes('night')) return ['night'];
  return ts.some(t=>NIGHTABLE.has(t)) ? ['day','night'] : ['day'];
}
/* "7:30pm–10:30pm" -> 19.5 ; "from sunset" -> whatever sunset is today */
function startHour(t,sunset){
  const s=String(t||'');
  if(/sunset|dusk|dark|evening/i.test(s)) return sunset;
  if(/dawn|sunrise/i.test(s)) return 6.5;
  const m=s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if(!m) return null;
  let h=(+m[1])%12; if(/pm/i.test(m[3])) h+=12;
  return h+(m[2]?+m[2]/60:0);
}
/* todayISO / daysAway / nextDate moved to notice-vocab.js on 26 Aug 2026 —
   the suburb and type pages date their events with the same rule. */

function derive(){const w=S.wx==='auto'?WX.auto:WX[S.wx];if(!w)return null;
  return{raining:w.rain>.1,dryTrails:w.rain48<2&&w.rain<=.1,warm:w.temp>=18,lowWind:w.wind<10,clear:w.cloud<20}}
function met(tag){const d=derive();if(!d)return null;
  switch(tag){case 'any-weather':return true;case 'dry-ground':return !d.raining;case 'dry-trails':return d.dryTrails;
  case 'warm':return d.warm;case 'low-wind':return d.lowWind;case 'clear-sky':return d.clear;
  case 'good-in-rain':return d.raining;default:return null}}
function suits(i){if(!S.wx)return null;const k=(i.cond||[]).map(met).filter(v=>v!==null);return k.length?k.every(Boolean):null}

/* The first filter used to be fifteen verbs — Listen, Watch, Swim — worked out
   from the type. It went when the types did. Two things killed it: `Run` meant
   every ocean swim and surf comp, because `sport-event` was one word covering
   six sports; and `Drink` was the only verb no type could produce, so it had to
   be read off the venue's kind instead, which meant it was the only accurate
   one. Splitting the types fixed the first and made the second unnecessary —
   `pub`, `bar`, `winery` and `brewery` are types now.

   What replaced it is GROUPS in notice-vocab.js: nine groups, every type in
   exactly one, so the counts add up and a new type has one obvious home. */

/* One extra fact per type — the one that decides whether you go. Two rules made
   this list, and both were learned the hard way:

   1. It must not repeat what the row already prints. The When cell carries the
      day, the time, the recurrence AND the season, so `time`, `how often` and
      `season` all printed the same fact twice — "Wednesday 6:30pm–9pm" beside
      "Time 6:30pm–9pm". Same failure as a venue in the name beside the venue in
      Where.
   2. The database must actually hold it for that type. `cost` is on 5% of gigs
      (the feed publishes no prices at all) but the venue's kind is on 82%, so a
      gig says what kind of room it is — a pub night and a hall night are not the
      same evening. That column only exists because `places.kind` was split from
      `places.offers` this morning.

   First slot that has a value wins, so the cell is rarely empty. */
const EXTRA_OF={
  /* what's on at a venue: where it is, then what it costs */
  gig:['place','cost'], comedy:['place','cost'], party:['place','cost'],
  reading:['place','cost'], festival:['cost','place'], market:['cost','place'],
  workshop:['cost','place'], community:['cost','place'],
  /* somewhere you pay to get into or eat at */
  cafe:['cost'], bakery:['cost'], restaurant:['cost'], bar:['cost'], pub:['cost'],
  winery:['cost'], brewery:['cost'], produce:['cost'], shop:['cost'],
  'camping ground':['cost'], museum:['cost'], cinema:['cost'], theatre:['cost'],
  'art gallery':['cost'], arts:['cost'], cultural:['cost'], nursery:['cost'],
  water:['cost'], golf:['cost'], 'farm life':['cost'],
  /* something you set aside time for */
  walk:['dur'], 'at-home':['dur'], 'mountain biking':['dur'], cycling:['dur'],
  running:['dur'], paddling:['dur'], volunteering:['dur'], nature:['dur'],
  /* somewhere with an age range that matters */
  skatepark:['who'], 'parks & playgrounds':['who'], 'rock climbing':['who'],
  /* somewhere the weather decides */
  beach:['cond'], night:['cond'], surfing:['cond'], swimming:['cond']};
const EXTRA_LABEL={cost:'Cost',dur:'How long',who:'Suits',cond:'Best in',place:'Setting'};
function extraOf(i){
  for(const slot of (EXTRA_OF[i.type]||['cost'])){
    const v={cost:i.cost, dur:i.dur, who:(i.ages||[]).join(', '),
             cond:(i.cond||[]).join(', '), place:i.placeKind}[slot];
    if(v && String(v).trim()) return {label:EXTRA_LABEL[slot], value:String(v)};
  }
  return null;
}

   /api/enrich asks Claude to research the gaps and hands back a PROPOSAL.
   Nothing is written by that call. The fields fill in marked as drafted, you
   change whatever is wrong, and submitting the form is what saves it. ══════ */
let ENRICH = null;   /* null = not checked, false = unavailable, true = live */
const F = id => document.getElementById(id);

function markSuggested(id, value, on=true){
  const el=F(id); if(!el || value===null || value===undefined || value==='') return;
  el.value = value;
  el.closest('.fld').classList.toggle('sug', on);
  el.addEventListener('input', ()=>el.closest('.fld').classList.remove('sug'), {once:true});
  el.addEventListener('change',()=>el.closest('.fld').classList.remove('sug'), {once:true});
}
function clearSuggestions(){
  document.querySelectorAll('.fld.sug').forEach(f=>f.classList.remove('sug'));
  F('f-review').classList.remove('on');
}

async function draft(){
  const name=F('f-name').value.trim();
  const url=F('f-url').value.trim();
  if(!name && !url){
    const ev = KIND==='event';
    msg(ev ? 'Paste the event link first — that is what it reads.'
           : 'Type a name first — that is what it searches for.');
    F(ev ? 'f-url' : 'f-name').focus(); return;
  }
  if(url && !/^https?:\/\//i.test(url)){
    msg('That link needs to start with http:// or https://'); F('f-url').focus(); return; }
  const btn=F('f-draft'); const was=btn.textContent;
  btn.disabled=true; btn.textContent = url ? 'Reading the link…' : 'Searching…'; msg('');
  try{
    const r=await fetch('/api/enrich',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({kind:KIND, name, url, location:F('f-where').value.trim(),
                           hint:F('f-desc').value.trim()})});
    if(r.status===501||r.status===404){ ENRICH=false; btn.hidden=true;
      msg('Autofill is not switched on for this site.'); return; }
    const d=await r.json();
    if(!r.ok){
      const human={
        no_credit:'Autofill is out of credit — the site owner needs to top up the Anthropic account. Fill this in by hand for now.',
        rate_limited:'Autofill is busy at the moment. Give it a minute and try again.'}[d.error];
      msg(human || ('Autofill failed: '+(d.message||d.error||r.status))); return; }
    const p=d.proposal||{};
    clearSuggestions();
    markSuggested('f-name',  p.name);
    markSuggested('f-where', p.location);
    markSuggested('f-type',  p.type);
    markSuggested('f-km',    p.km);
    markSuggested('f-cost',  p.cost);
    markSuggested('f-desc',  p.description);
    markSuggested('f-url',   p.url);
    if(KIND==='event'){ markSuggested('f-date', p.starts_on); markSuggested('f-time', p.time_text); }
    else { markSuggested('f-dur', p.duration);
           markSuggested('f-when', p.daypart==='both'?'both':(p.daypart==='night'?'night':'day')); }

    F('f-reason').textContent = p.reasoning || 'No notes returned.';
    F('f-sources').innerHTML = (d.sources||[]).map(s=>
      `<li><a href="${s.url}" target="_blank" rel="noopener">${(s.title||s.url).slice(0,60)}</a></li>`).join('')
      || '<li><span class="warn">No sources cited.</span></li>';
    const gaps=[];
    if(!F('f-name').value.trim()) gaps.push('no name found — type one before you save');
    if(!p.url) gaps.push('no link found');
    if(KIND==='event' && !p.starts_on) gaps.push('no date confirmed');
    if(KIND==='event' && p.date_confidence && p.date_confidence!=='high')
      gaps.push('date is '+p.date_confidence+' confidence');
    if(!d.searched) gaps.push('the web search returned nothing — treat this as a guess');
    F('f-warn').textContent = gaps.length
      ? 'Check before saving: '+gaps.join(' · ')
      : 'Everything above is sourced. Still worth a read before you save it.';
    F('f-review').classList.add('on');
    msg('Filled in. Change anything that is wrong, then add it.');
  }catch(e){ msg('Could not reach the autofill service.'); }
  finally{ btn.disabled=false; btn.textContent=was; }
}

async function persist(name){
  if(!ART){ msg(`"${name}" is on this page for now — export to keep it.`); return; }
  try{
    const res=await fetch(location.href,{cache:'no-store'});
    const src=await res.text();
    const re=/(<script id="additions" type="application\/json">)[\s\S]*?(<\/script>)/;
    if(!re.test(src)) throw new Error('island');
    const next=src.replace(re,(m,a,b)=>a+JSON.stringify(ADDED).replace(/<\//g,'<\\/')+b);
    await ART.publish(next);
    msg(`"${name}" saved to the page.`);
  }catch(err){
    const c=err&&err.code;
    if(c==='conflict')      msg('Someone else saved first — reloading with their version.');
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared')
      msg(`"${name}" is showing for you, but this view is read-only so it wasn't saved. Export to keep it.`);
    else if(c==='rate_limited') msg('Saving too fast — it is on the page; try Export.');
    else msg(`"${name}" is on the page but could not be saved. Export to keep it.`);
  }
}

let ALL=[], LIVE=null;
function rebuild(){
  const base = LIVE ? LIVE
    : [...DATA.activities.map(a=>({...a,ev:false})), ...DATA.events.map(e=>({...e,ev:true}))];
  /* keep events with no date yet — they are waiting on information, not finished */
  ALL=[...base, ...(LIVE?[]:ADDED)]
    .filter(i=>!i.ev || !i.date || (daysAway(nextDate(i))??0)>=0);
}

const THISYEAR=new Date().getFullYear();
const SEASONS=['summer','autumn','winter','spring'];
/* When = when you can go. Duration = how long it takes. Two different questions. */
function whenText(i){
  if(i.ev && !i.date) return 'Date not set';
  if(!i.ev){
    const p=dayparts(i);
    const lbl = p.length===2 ? 'Any time' : p[0]==='night' ? 'After dark' : 'Daylight';
    const ss=(i.season||[]).filter(x=>x!=='any'&&SEASONS.includes(x));
    const seasonal = ss.length && ss.length<4
      ? `<span class="tm">${esc(ss.length===1?ss[0]:ss[0]+'–'+ss[ss.length-1])}</span>` : '';
    return lbl+seasonal;
  }
  const nd=nextDate(i), dt=new Date(nd+'T00:00:00'), d=daysAway(nd);
  /* show the year whenever it is not this one — "25 Apr" alone reads as this April */
  const dated = dt.toLocaleDateString('en-AU',
    {day:'numeric',month:'short',...(dt.getFullYear()!==THISYEAR?{year:'numeric'}:{})});
  /* Inside the week, name the day the way a person would say it out loud. Day 7
     is the same weekday as today, so "This Monday" on a Monday would read as
     today — it gets the date instead. Recurrence and date confidence have moved
     into the open row; the list says when, not how often or how sure. */
  const lbl = d===0?'Today' : d===1?'Tomorrow'
    : (d>1&&d<7) ? 'This '+dt.toLocaleDateString('en-AU',{weekday:'long'}) : dated;
  /* The line above already says which day. A weekday inside the time text is
     the same fact twice — "12 Sept / Saturday, from early morning" — so it comes
     off either end. Three rows lead with one, none of them is only a weekday. */
  const DAY=/(mon|tues|wednes|thurs|fri|satur|sun)days?/i;
  const time = i.time ? String(i.time)
    .replace(new RegExp('^\\s*'+DAY.source+'\\s*[,\u2013-]?\\s*','i'),'')
    .replace(new RegExp('\\s*'+DAY.source+'\\s*$','i'),'').trim() : '';
  return lbl + (time?`<span class="tm">${esc(time)}</span>`:'');
}
function whenOK(i){
  /* Three answers, because that is how many questions a person actually has:
     is it on today, is it on tomorrow, or show me everything. A place has no
     date, so it is on whichever day you ask about — the daylight arithmetic
     that used to gate "Now" said a beach was unavailable at 10pm, which is
     true of the light but not of the beach. */
  if(S.when==='any') return true;
  if(!i.ev) return true;
  const d=daysAway(nextDate(i));
  /* "This week" is exactly the span the date labels name as a day — Today,
     Tomorrow, This Thursday. Day 7 is the same weekday as today and prints as
     a date, so it belongs to the week after. */
  if(S.when==='week') return d!=null && d>=0 && d<7;
  return S.when==='tomorrow' ? d===1 : d===0;
}
function atHomeHidden(i){
  /* "At home" is a theme you choose, not the answer to "what's on near me". With no
     theme picked and nothing searched, keep these out of the default list — they
     outnumber the real places and they are all zero km, so they used to lead it. */
  return !S.group.length && !S.type.length && !S.q && (i.groups||[]).includes('home');
}
/* Shop and Maker exist so a type page has somewhere to buy the gear and
   somebody to buy it from. They are not answers to "what shall we do on
   Saturday", and being off this list is the whole reason they are their own
   kinds rather than a flag somebody has to remember to set.

   The four kind filters — Go somewhere / What's on / Join in / At home —
   are not built yet, so this holds those two back on its own. When the filters
   land, this becomes a case of the filter rather than a rule beside it, and
   atHomeHidden() goes the same way: `kind = 'idea'` says properly what that
   function has been approximating.

   Saving something is asking for it, so a saved shop still shows in the saved
   view — the same exemption at-home rows get. */
const OFF_BOARD = new Set(['shop', 'maker']);

function ok(i){
  if(S.saved && !isSaved(i)) return false;
  if(!S.saved && OFF_BOARD.has(i.kind)) return false;
  if(!whenOK(i)) return false;
  /* Something you saved is something you asked for, so the At home entries the
     default list holds back are not held back from your own list. */
  if(!S.saved && atHomeHidden(i)) return false;
  if(S.group.length && !groupsOf(i).some(g=>S.group.includes(g))) return false;
  if(S.type.length && !typesOf(i).some(t=>S.type.includes(t))) return false;
  if(S.suburb.length && !S.suburb.includes(suburbOf(i.loc))) return false;
  if(i.km!=null && i.km>S.km) return false;
  if(S.cost.length && !S.cost.includes(i.cost)) return false;
  if(S.who.length && !(i.ages||[]).some(a=>S.who.includes(a)||a==='all-ages')) return false;
  if(S.wx && suits(i)===false) return false;
  if(S.q){const h=[i.name,i.loc,i.place,typesOf(i).join(' '),i.desc,(i.tags||[]).join(' ')].join(' ').toLowerCase();
    if(!h.includes(S.q))return false}
  return true;
}
/* Where something is happening is two facts, and the suburb is the weaker one:
   "Torquay" does not tell you the gig is at the Torquay Hotel. The listings view
   keeps the venue and the suburb apart, so print the venue and put the suburb
   under it — the same two-line shape the When column uses for its time.
   One line when either is missing, or when one already contains the other:
   "Bells Beach" under "Bells Beach / Torquay" is the same fact twice, not two.
   Activities mostly have no place of their own and are unchanged — the column
   is null for them, so this falls through to the suburb they always printed. */
function whereParts(i){
  let place=(i.place||'').trim(); const suburb=(i.loc||'').trim();
  /* A row linked to its own place row — how a shop or a venue inherits a
     coordinate without a second copy of it — carries its own name here, so it
     would print "Patagonia Torquay" against "Patagonia Torquay". */
  if(place && place.toLowerCase()===String(i.name||'').trim().toLowerCase()) place='';
  if(!place || !suburb) return [place||suburb, ''];
  const a=place.toLowerCase(), b=suburb.toLowerCase();
  if(a.includes(b) || b.includes(a)) return [a.length>=b.length?place:suburb, ''];
  return [place, suburb];
}
const whereLine = i => whereParts(i).filter(Boolean).join(', ');

/* Most listings carry a map pin, but a researched or community-added one often
   carries the venue's own site instead. Calling that "Open in Maps" sends people
   somewhere they were not promised, so label the link by what it actually is.
   Events reuse info_url in the url slot, which is why the caller skips the
   duplicate rather than rendering the same link twice. */
const isMapLink = u => /(?:google\.[a-z.]+\/maps|maps\.google\.|maps\.app\.goo\.gl|maps\.apple\.com|openstreetmap\.org)/i.test(u||'');

function sortFn(a,b){
  if(S.sort==='az')   return a.name.localeCompare(b.name);
  if(S.sort==='new'){
    const k=i=>i.created?Date.parse(i.created):0;
    return (k(b)-k(a))||((b.id||0)-(a.id||0));
  }
  if(S.sort==='best') return (b.rating||0)-(a.rating||0)||(a.km??999)-(b.km??999);
  if(S.sort==='when'){
    /* a low-confidence date is unknown, not imminent — send those to the end, not the top */
    const k=i=>i.ev?(i.date?(daysAway(nextDate(i))??9e5):9e5):9e3;
    return k(a)-k(b)||(a.km??999)-(b.km??999)}
  return (a.km??999)-(b.km??999)||(b.rating||0)-(a.rating||0);
}
function render(){
  syncClear();
  const list=ALL.filter(ok).sort(sortFn);
  VISIBLE=list;
  const hidden = !S.group.length && !S.type.length && !S.q ? ALL.filter(i=>whenOK(i)&&(i.groups||[]).includes('home')).length : 0;
  document.getElementById('tally').textContent =
    list.length===1 ? '1 thing pinned' : list.length+' things pinned';
  paintChips();
  document.getElementById('rows').innerHTML = list.length ? list.map(i=>{
    const [wVenue,wSuburb]=whereParts(i);
    const sk=keyOf(i), kept=SAVED.has(sk);
    return `<div class="rec">
      <div class="rowhead${kept?' saved':''}"${(i.groups||[])[0]?` data-tint="${i.groups[0]}"`:''}>
      <button class="rowline" aria-expanded="false">
        <span class="c-icon" aria-hidden="true">${ICON_OF[i.type]?`<svg><use href="#i-${ICON_OF[i.type]}"/></svg>`:''}</span>
        <span class="c-name"><span class="nm">${esc(i.name)}</span>${i.added?`<span class="mine" title="${i.by?esc(i.by)+' added this — ':''}not checked yet">unverified</span>`:''}</span>
        <span class="c-type">${i.type?esc(i.type):'<span class="est" style="display:inline">unsorted</span>'}</span>
        <span class="c-where">${esc(wVenue)}${wSuburb?`<span class="tm">${esc(wSuburb)}</span>`:''}</span>
        <span class="c-when">${whenText(i)}</span>
        <span class="c-extra">${(()=>{const x=extraOf(i);return x?esc(x.value):''})()}</span>
        <span class="mob">${[i.type, whereLine(i), whenText(i).replace(/<[^>]+>/g,'\u001f'),
          (()=>{const x=extraOf(i);return x?x.value:''})()]
          .flatMap(v=>String(v==null?'':v).split('\u001f')).map(v=>v.trim())
          .filter(Boolean).map(esc).join(' &middot; ')}</span>
      </button>
      <button class="savebtn${kept?' on':''}" type="button" data-k="${sk}" aria-pressed="${kept}"
              aria-label="${kept?'Saved':'Save'}: ${esc(i.name)}"
              title="${kept?'Saved — click to remove':'Save this'}"><span class="glyph">\u{1F4CC}</span></button>
      </div>
      <div class="detail"><div class="detail-in">
        <div>
          <p>${i.desc?esc(i.desc):'<em style="color:var(--ink3)">No description yet.</em>'}</p>
          <div class="links">
            ${i.url&&i.url!==i.info?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${isMapLink(i.url)?'Open in Maps':'Website'}</a>`:''}
            ${i.info?`<a href="${esc(i.info)}" target="_blank" rel="noopener">More info</a>`:''}
            ${i.ticket?`<a href="${esc(i.ticket)}" target="_blank" rel="noopener">Tickets</a>`:''}
            ${i.lat?`<a href="https://www.google.com/maps/dir/?api=1&destination=${i.lat},${i.lng}" target="_blank" rel="noopener">Directions</a>`:''}
          </div>
        </div>
        <div>
          ${i.notes?`<p class="dl"><b>Good to know</b><span>${esc(i.notes)}</span></p>`:''}
          ${(i.cond||[]).length?`<p class="dl"><b>Best conditions</b><span>${esc(i.cond.join(', '))}</span></p>`:''}
          ${(i.ages||[]).length?`<p class="dl"><b>Suits</b><span>${esc(i.ages.join(', '))}</span></p>`:''}
          ${i.time?`<p class="dl"><b>Time</b><span>${esc(i.time)}</span></p>`:''}
          ${!i.ev&&i.dur?`<p class="dl"><b>How long</b><span>${esc(i.dur)}</span></p>`:''}
          ${i.ev&&i.recur?`<p class="dl"><b>How often</b><span>${esc(i.recur)}</span></p>`:''}
          <!-- date_confidence is deliberately not printed. Scott is happy with the
               dates as they stand (25 Aug 2026). The column still records what was
               actually checked; nothing was raised to high to silence the label.
               No backticks in here: this comment sits inside a template literal. -->
          ${!i.ev&&(i.season||[]).length?`<p class="dl"><b>Season</b><span>${esc(i.season.join(', '))}</span></p>`:''}
          ${i.rating?`<p class="dl"><b>Rating</b><span>${i.rating} / 5</span></p>`:''}
        </div>
      </div></div>
    </div>`}).join('') : `<div class="none">${S.saved
      ? 'Nothing saved yet. Click the pin at the end of a row to keep it here.'
      : 'Nothing matches that.'}</div>`;

  document.querySelectorAll('.rowline').forEach(b=>b.addEventListener('click',()=>{
    const r=b.closest('.rec'), o=r.classList.toggle('open');
    b.setAttribute('aria-expanded',o);
  }));
  paintMap();
}

/* ══ map ═══════════════════════════════════════════════════════════════════
   MapLibre GL JS, fetched from the CDN only when someone actually opens the
   map. If that fetch fails the list is untouched and the map says so — the
   page must never depend on a third party to render its own data.

   Basemap is CARTO's Positron / Dark Matter: vector, no API key, swapped with
   the page's own light/dark. Attribution rides along in their TileJSON, so the
   control fills itself in — don't add a second copy by hand, it prints twice.

   A pin is drawn from a real lat/lng or not at all. Everything in the current
   filter that has no coordinates is counted out loud underneath the map rather
   than quietly dropped, because a map that silently shows two thirds of the
   database is a map that lies. ════════════════════════════════════════════ */
/* Pinned to the 5.x line on purpose: 6.x ships ESM only, split across a shared
   chunk and a module worker, which wants a bundler. This file has no build step,
   so the UMD build that puts `maplibregl` on window is the one that fits. */
const MAPLIBRE='https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl';
const BASEMAP={light:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
               dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'};
let MAP=null, MARKS=[], MAPSIG=null, LOADING=null, VISIBLE=[], FITTED=false;

const isDark=()=>document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme==='dark'
  : matchMedia('(prefers-color-scheme:dark)').matches;

function loadMapLibre(){
  if(window.maplibregl) return Promise.resolve();
  return LOADING ||= new Promise((ok,fail)=>{
    const css=document.createElement('link');
    css.rel='stylesheet'; css.href=MAPLIBRE+'.css';
    /* First in the head, not last: MapLibre's stylesheet and this page's own use the
       same selectors at the same weight, so whichever lands later wins. Appended, it
       repaints the popups white over the top of a dark page. */
    document.head.insertBefore(css, document.head.firstChild);
    const js=document.createElement('script');
    js.src=MAPLIBRE+'.min.js'; js.onload=ok;
    js.onerror=()=>{ LOADING=null; fail(new Error('cdn')); };
    document.head.appendChild(js);
  });
}

/* Several things genuinely happen at one place — five listings sit on Bells Beach.
   Those share a pin and the pin says how many, rather than being nudged apart into
   five coordinates that are not true. */
const atKey=i=>Number(i.lat).toFixed(5)+','+Number(i.lng).toFixed(5);
function popupHTML(group){
  return '<div class="pop">'+group.map(i=>{
    const meta=[i.type, whereLine(i), i.km!=null?i.km+' km':''].filter(Boolean).map(esc).join(' &middot; ');
    const d=String(i.desc||'');
    const links=[
      i.url&&i.url!==i.info&&!isMapLink(i.url)?`<a href="${esc(i.url)}" target="_blank" rel="noopener">Website</a>`:'',
      i.info?`<a href="${esc(i.info)}" target="_blank" rel="noopener">More info</a>`:'',
      i.ticket?`<a href="${esc(i.ticket)}" target="_blank" rel="noopener">Tickets</a>`:'',
      `<a href="https://www.google.com/maps/dir/?api=1&destination=${i.lat},${i.lng}" target="_blank" rel="noopener">Directions</a>`
    ].join('');
    return `<h4>${esc(i.name)}</h4><p class="meta">${meta}</p>`
         + (d?`<p class="txt">${esc(d.length>170?d.slice(0,170).trim()+'…':d)}</p>`:'')
         + links;
  }).join('')+'</div>';
}

function paintMap(){
  const note=document.getElementById('mapnote');
  const pinned=VISIBLE.filter(i=>i.lat!=null&&i.lng!=null);
  const blank=VISIBLE.length-pinned.length;
  const blankEv=VISIBLE.filter(i=>i.ev&&i.lat==null).length;
  if(note) note.innerHTML = VISIBLE.length===0 ? 'Nothing matches that.'
    : `<b>${pinned.length}</b> of ${VISIBLE.length} on the map`
      + (blank?` &middot; ${blank} have no coordinates yet`:'')
      + (blankEv?`, ${blankEv} of those events &mdash; no venue is geocoded`:'')
      + ' &middot; distances in the list are driving km from Jan Juc, not the line you see here';
  if(S.view!=='map'||!MAP) return;

  const sig=pinned.map(i=>i.id).join(',');
  if(sig===MAPSIG) return;
  MAPSIG=sig;
  MARKS.forEach(m=>m.remove()); MARKS=[];

  const groups=new Map();
  pinned.forEach(i=>{ const k=atKey(i); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(i); });

  const bounds=new maplibregl.LngLatBounds();
  groups.forEach(group=>{
    const i=group[0], el=document.createElement('div');
    el.className='pin'+(group.length>1?' multi':'');
    el.setAttribute('role','button'); el.tabIndex=0;
    el.title=group.length>1 ? group.length+' things here' : i.name;
    if(group.length>1) el.innerHTML='<b>'+group.length+'</b>';
    const m=new maplibregl.Marker({element:el})
      .setLngLat([+i.lng,+i.lat])
      .setPopup(new maplibregl.Popup({offset:14,maxWidth:'300px'}).setHTML(popupHTML(group)))
      .addTo(MAP);
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); }});
    MARKS.push(m);
    bounds.extend([+i.lng,+i.lat]);
  });

  /* Follow the filter. The first fit jumps — an animation started before the basemap
     has finished arriving gets dropped and leaves the map on its opening view. */
  if(groups.size){
    MAP.fitBounds(bounds,{padding:{top:60,right:60,bottom:60,left:60},maxZoom:13,
                          duration:FITTED?500:0});
    FITTED=true;
  }
}

function buildMap(){
  const el=document.getElementById('map');
  el.innerHTML='';
  MAP=new maplibregl.Map({
    container:el, style:BASEMAP[isDark()?'dark':'light'],
    center:[JJ.lng,JJ.lat], zoom:9, attributionControl:{compact:true}});
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  MAP.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');
  /* Jan Juc itself — every km in the database is measured from here. */
  const home=document.createElement('div');
  home.className='pin home'; home.title='Jan Juc — distances are measured from here';
  new maplibregl.Marker({element:home}).setLngLat([JJ.lng,JJ.lat]).addTo(MAP);
  /* Pins go on straight away rather than waiting for `load`. They are HTML sitting
     over the canvas, not part of the style, so they do not need the basemap — and on
     a slow connection the listings appear while the tiles are still arriving. */
  MAPSIG=null; paintMap();
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{
    if(MAP && !document.documentElement.dataset.theme) MAP.setStyle(BASEMAP[isDark()?'dark':'light']);
  });
}

const viewBtns=[...document.querySelectorAll('#viewseg button')];
async function showView(v){
  S.view=v;
  viewBtns.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===v)));
  document.body.classList.toggle('mapview', v==='map');
  if(v!=='map') return;
  /* on a phone the filters fill the screen and the map starts below the fold —
     take the reader to it rather than leaving them looking at a dropdown */
  const wrap=document.getElementById('mapwrap');
  if(wrap.getBoundingClientRect().top > innerHeight*0.5)
    wrap.scrollIntoView({block:'start', behavior:'smooth'});
  if(MAP){ MAP.resize(); MAPSIG=null; paintMap(); return; }
  const el=document.getElementById('map');
  el.innerHTML='<div class="mapstate">Fetching the map…</div>';
  try{ await loadMapLibre(); }
  catch(e){ el.innerHTML='<div class="mapstate">The map couldn’t load. The list still works — switch back to it.</div>'; return; }
  buildMap();
}
viewBtns.forEach(b=>b.addEventListener('click',()=>showView(b.dataset.v)));
S.view='list';
rebuild();
/* ── multi-select ───────────────────────────────────────────────────────────
   One question, several answers. Each instance owns an array on S; the button
   summarises it, the panel holds the checkboxes. Options with nothing behind
   them are shown but not selectable — a filter that silently drops a choice is
   worse than one that shows you the choice is empty. */
const MULTI={};
function makeMulti(hostId, key, allLabel, label){
  const host=document.getElementById(hostId);
  host.innerHTML=`<button type="button" class="ms-btn" aria-expanded="false"`
    +` aria-haspopup="true">${allLabel}</button>`
    +`<div class="ms-pop" hidden role="group" aria-label="${label}"></div>`;
  const btn=host.querySelector('.ms-btn'), pop=host.querySelector('.ms-pop');
  const m={host, btn, pop, key, allLabel, options:[]};
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    const open=btn.getAttribute('aria-expanded')==='true';
    closeAllMulti();
    if(!open){ btn.setAttribute('aria-expanded','true'); pop.hidden=false; }
  });
  pop.addEventListener('click',e=>e.stopPropagation());
  MULTI[key]=m; return m;
}
function closeAllMulti(){
  Object.values(MULTI).forEach(m=>{
    m.btn.setAttribute('aria-expanded','false'); m.pop.hidden=true;});
}
document.addEventListener('click',closeAllMulti);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAllMulti(); });

/* `avail` counts what the other filters leave, so an impossible option greys out.
   The number itself is not printed — the row of listings is the answer. */
function paintMulti(m, options, avail){
  /* The full list stays on `m` for paintChips, which has to label a choice that
     is no longer in the menu. */
  m.options=options;
  const chosen=S[m.key];
  /* An option that would return nothing is left out, not greyed out. Picking
     The ocean should leave five types in the Type menu, not 43 with 38 of them
     dead — a menu you have to read past is worse than a shorter one. Anything
     already ticked stays, whatever its count, or you could not untick it. */
  const live=options.filter(([v])=>avail(v)>0 || chosen.includes(v));
  m.pop.innerHTML=(live.length
    ? live.map(([v,l])=>{
        const n=avail(v), on=chosen.includes(v);
        return `<label><input type="checkbox" value="${esc(v)}"`
          +`${on?' checked':''}><span>${esc(l)}</span>`
          +`<span class="n">${n}</span></label>`;
      }).join('')
    : `<p class="ms-none">Nothing here with the other filters on.</p>`)
    + (chosen.length?`<button type="button" class="ms-clear">Clear</button>`:'');
  m.pop.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
    S[m.key]=cb.checked ? [...S[m.key],cb.value] : S[m.key].filter(x=>x!==cb.value);
    afterFacetChange(m.key);
  }));
  const c=m.pop.querySelector('.ms-clear');
  if(c) c.addEventListener('click',()=>{S[m.key]=[];afterFacetChange(m.key);});

  const labels=chosen.map(v=>(options.find(o=>o[0]===v)||[v,v])[1]);
  m.btn.textContent = !labels.length ? m.allLabel
    : labels.length===1 ? labels[0] : `${labels[0]} +${labels.length-1}`;
  m.btn.classList.toggle('on', !!labels.length);
}
function afterFacetChange(key){
  /* Dated things are a diary, not a directory — they only read in date order */
  if(key==='group' && S.group.includes('music')){
    S.sort='when'; document.getElementById('sort').value='when';
  }
  refreshFacets(); render();
}

makeMulti('ms-group','group','Anything','What kind of thing');
makeMulti('ms-type','type','All types','Type of listing');
makeMulti('ms-suburb','suburb','Anywhere','Suburb or town');
makeMulti('ms-cost','cost','Any cost','Cost');
makeMulti('ms-who','who','Anyone','Who it suits');

const COST_ORDER=['Free','Cheap','Moderate','Splurge'];
const WHO=[['toddler','Toddlers'],['kids','Kids'],['teens','Teens'],['adults','Adults']];
function refreshFacets(){
  /* Availability is measured against everything else that is on — When and
     Distance included — because the grey state is the only signal left once the
     counts are gone, and an option that looks live but returns nothing is the
     lie the numbers used to prevent. A facet never counts against itself, or
     picking one option would grey out its own siblings. */
  const pass=(i,skip)=>
       (!S.saved || isSaved(i)) && whenOK(i) && !(i.km!=null && i.km>S.km) && !(S.wx && suits(i)===false)
    && (!S.q || [i.name,i.loc,i.place,typesOf(i).join(' '),i.desc,(i.tags||[]).join(' ')]
                  .join(' ').toLowerCase().includes(S.q))
    && (skip==='group' || !S.group.length || groupsOf(i).some(g=>S.group.includes(g)))
    && (skip==='type' || !S.type.length || typesOf(i).some(t=>S.type.includes(t)))
    && (skip==='suburb' || !S.suburb.length || S.suburb.includes(suburbOf(i.loc)))
    && (skip==='cost' || !S.cost.length || S.cost.includes(i.cost))
    && (skip==='who'  || !S.who.length  || (i.ages||[]).some(a=>S.who.includes(a)||a==='all-ages'));

  const pool=k=>ALL.filter(i=>pass(i,k));
  const pv=pool('group'), pt=pool('type'), pc=pool('cost'), pw=pool('who'), ps=pool('suburb');

  paintMulti(MULTI.group, GROUPS, g=>pv.filter(i=>groupsOf(i).includes(g)).length);
  /* Every type any row carries, not just its first — or a type that is only ever
     a second one (cinema on a film festival) would be missing from the menu.

     With a group picked, the menu is that group's own types and nothing else.
     It used to be every type still capable of narrowing the list, which is a
     defensible answer to a different question and read as a bug: picking The
     arts & culture offered `surfing`, because the Bells Beach Surf Film
     Festival is festival, surfing and cinema at once and lands in three groups.
     True, and no help — the first filter is meant to teach the shape of the
     site, so the menu under it has to be the fixed list that belongs to it.
     The film festival is still reachable by surfing under The ocean, where a
     reader would look for it anyway.

     A type already ticked stays listed even when it leaves the group, or
     picking a group would strip a filter you set with no way to put it back. */
  const inGroup = t => !S.group.length || S.group.includes(GROUP_OF[t]);
  const types=[...new Set(ALL.flatMap(typesOf))]
                .filter(t=>inGroup(t)||S.type.includes(t)).sort();
  paintMulti(MULTI.type, types.map(t=>[t,t]), t=>pt.filter(i=>typesOf(i).includes(t)).length);
  /* only offer a suburb something is actually in */
  const subs=PLACE_ORDER.filter(x=>ALL.some(i=>suburbOf(i.loc)===x));
  paintMulti(MULTI.suburb, subs.map(x=>[x,x]), x=>ps.filter(i=>suburbOf(i.loc)===x).length);
  const costs=COST_ORDER.filter(c=>ALL.some(i=>i.cost===c));
  paintMulti(MULTI.cost, costs.map(c=>[c,c]), c=>pc.filter(i=>i.cost===c).length);
  paintMulti(MULTI.who, WHO, w=>pw.filter(i=>(i.ages||[]).some(a=>a===w||a==='all-ages')).length);
}
refreshFacets();
[['km','km'],['wx','wx'],['sort','sort']].forEach(([id,key])=>{
  document.getElementById(id).addEventListener('change',e=>{
    S[key]= key==='km' ? +e.target.value : e.target.value;
    if(key==='wx' && e.target.value==='auto') return void useAuto(e.target);
    if(key!=='sort') refreshFacets();
    render()})});

document.getElementById('whenseg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  S.when=b.dataset.w;
  [...e.currentTarget.children].forEach(x=>
    x.setAttribute('aria-pressed', String(x===b)));
  refreshFacets(); render();
});

/* Every filter that is on, said plainly, and one click to take it off — for the
   controls that cannot show their own state. The multi-selects summarise ("Listen
   +1") and the secondary four are folded away behind a button, so those need
   saying out loud. When does not: it is three buttons and the pressed one is
   visible, so a chip would print the same fact twice. */
function paintChips(){
  const box=document.getElementById('chips');
  const out=[];
  const label=(k,v)=>({group:(GROUPS.find(o=>o[0]===v)||[v,v])[1],
                       who:(WHO.find(o=>o[0]===v)||[v,v])[1]}[k] ?? v);
  ['group','type','suburb','cost','who'].forEach(k=>
    S[k].forEach(v=>out.push([k, v, label(k,v)])));
  if(S.km!==999)     out.push(['km', 999, 'Within '+S.km+' km']);
  if(S.wx)           out.push(['wx', '', {auto:'Weather now',fine:'Fine',grey:'Grey & cold',
                                          rain:'Raining'}[S.wx] || S.wx]);
  if(S.q)            out.push(['q', '', '\u201c'+S.q+'\u201d']);
  if(S.saved)        out.push(['saved', '', 'Saved only']);
  box.innerHTML=out.map(([k,v,l])=>
    `<button class="chip" type="button" data-k="${k}" data-v="${esc(String(v))}"`
    +` aria-label="Remove filter ${esc(l)}">${esc(l)}<span class="x">&times;</span></button>`).join('');
}
document.getElementById('savedbtn').addEventListener('click',()=>{
  S.saved=!S.saved; refreshFacets(); render();
});
/* One listener for every pin, because the rows are rebuilt on every render.
   Toggling only redraws the list when you are inside the saved view — the row
   has just left it. Anywhere else a redraw would shut every open row. */
document.getElementById('rows').addEventListener('click',e=>{
  const b=e.target.closest('.savebtn'); if(!b) return;
  const k=b.dataset.k;
  toggleSaved(k);
  const on=SAVED.has(k);
  b.classList.toggle('on',on);
  b.closest('.rowhead').classList.toggle('saved',on);
  b.setAttribute('aria-pressed',String(on));
  b.title = on ? 'Saved — click to remove' : 'Save this';
  b.setAttribute('aria-label', (on?'Saved: ':'Save: ')+b.getAttribute('aria-label').replace(/^Saved?: /,''));
  syncSavedPill();
  /* restart the animation rather than add a class that is already there */
  b.classList.remove('press','unpress'); void b.offsetWidth;
  b.classList.add(on?'press':'unpress');
  if(S.saved){
    const rec=b.closest('.rec'), still=matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(still){ render(); return }
    if(rec) rec.classList.add('leaving');
    setTimeout(render, 260);
  }
});
document.getElementById('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const k=c.dataset.k, v=c.dataset.v;
  if(Array.isArray(S[k])) S[k]=S[k].filter(x=>x!==v);
  else if(k==='km')  { S.km=999; document.getElementById('km').value='999'; }
  else if(k==='wx')  { S.wx=''; document.getElementById('wx').value=''; }
  else if(k==='q')   { S.q=''; document.getElementById('q').value=''; }
  else if(k==='saved') S.saved=false;
  refreshFacets(); render();
});

/* the four secondary filters, and a dot when any of them is doing something */
const moreBtn=document.getElementById('morebtn'), moreBox=document.getElementById('more');
moreBtn.addEventListener('click',e=>{
  e.stopPropagation(); closeAllMulti();
  const open=moreBtn.getAttribute('aria-expanded')==='true';
  moreBtn.setAttribute('aria-expanded',String(!open));
  moreBox.hidden=open;
});
moreBox.addEventListener('click',e=>e.stopPropagation());
function syncMoreDot(){
  const on = S.km!==999 || S.cost.length || S.who.length || S.wx;
  document.getElementById('moredot').hidden = !on;
}
document.getElementById('q').addEventListener('input',e=>{
  S.q=e.target.value.trim().toLowerCase(); refreshFacets(); render();});

const DEFAULTS={when:'any',group:[],type:[],suburb:[],km:999,cost:[],who:[],wx:'',q:'',saved:false};   /* sort is a view, not a filter */
function syncClear(){
  const on = Object.keys(DEFAULTS).some(k=>Array.isArray(DEFAULTS[k])
    ? S[k].length : S[k]!==DEFAULTS[k]);
  document.getElementById('clear').hidden = !on;
  syncMoreDot();
  syncSavedPill();
}
document.getElementById('clear').addEventListener('click',()=>{
  Object.keys(DEFAULTS).forEach(k=>S[k]=Array.isArray(DEFAULTS[k])?[]:DEFAULTS[k]);
  S.sort='when'; document.getElementById('sort').value='when';
  ['km','wx'].forEach(id=>document.getElementById(id).value=String(DEFAULTS[id]));
  [...document.getElementById('whenseg').children].forEach(x=>
    x.setAttribute('aria-pressed', String(x.dataset.w===DEFAULTS.when)));
  refreshFacets();
  document.getElementById('km').value='999';
  document.getElementById('q').value='';
  render();
});

async function useAuto(sel){
  const opt=sel.options[1];
  opt.textContent='Checking…';
  const w=await fetchWeather();
  if(!w){
    opt.textContent='Detect automatically — unavailable here';
    sel.value=''; S.wx=''; render();
    return;
  }
  WX.auto=w;
  const bits=[Math.round(w.temp)+'\u00B0', w.rain>0.1?'raining':'dry', Math.round(w.wind)+' km/h'];
  opt.textContent='Now — '+bits.join(', ');
  render();
}
function refreshClock(){
  const now=melbNow(), {set}=sunHours(now);
  const h=now.getHours()+now.getMinutes()/60, dark=h>=set||h<sunHours(now).rise;
  const t=now.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).toLowerCase();
  document.getElementById('sub').textContent =
    now.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})+
    '  ·  '+t+'  ·  Jan Juc & the Surf Coast';
}
refreshClock();
setInterval(()=>{refreshClock();render()},60000);   /* keep it honest as the evening comes on */
render();

/* The baked-in copy renders first so the page is never blank, then the live
   rows replace it. If the database is unreachable the page keeps the copy it
   shipped with and says so rather than pretending to be current. */
(async()=>{
  const badge=document.getElementById('src');
  if(!REMOTE){ badge.textContent='built-in copy'; return; }
  const rows=await loadRemote();
  if(rows){ LIVE=rows; rebuild(); refreshFacets(); render(); badge.textContent='live'; }
  else { badge.textContent='offline copy';
    badge.title='Could not reach the database — showing the version built into this page.'; }
})();

/* ── light / dark / follow the system ──
   The stylesheet already had the three-state shape: bare :root is light, the
   prefers-color-scheme block is guarded with :not([data-theme="light"]), and
   [data-theme="dark"] overrides both. So the switcher only has to set or clear
   one attribute — no colour is redefined here.

   Auto is a real third state, not a default. Clearing the key means "follow the
   system", so someone who flips their laptop to dark at sunset gets the page
   with it; storing 'light' means they have overruled that on purpose. */
const THEMEKEY='notice.theme', MODES=['auto','light','dark'];
const themeBtn=document.getElementById('themebtn');

function syncThemeBtn(){
  const m=document.documentElement.dataset.theme||'auto';
  themeBtn.querySelector('b').textContent=m[0].toUpperCase()+m.slice(1);
  const next=MODES[(MODES.indexOf(m)+1)%MODES.length];
  themeBtn.title = (m==='auto'?'Following your system':'Forced to '+m)+
                   ' \u2014 click for '+next;
  themeBtn.setAttribute('aria-label','Colour scheme: '+m+'. Click for '+next+'.');
}

themeBtn.addEventListener('click',()=>{
  const m=document.documentElement.dataset.theme||'auto';
  const next=MODES[(MODES.indexOf(m)+1)%MODES.length];
  if(next==='auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=next;
  /* Private browsing refuses to write, same as the saved pins: the choice holds
     for this visit and is simply not there next time. */
  try{ next==='auto' ? localStorage.removeItem(THEMEKEY)
                     : localStorage.setItem(THEMEKEY,next) }catch(e){}
  syncThemeBtn();
  /* The basemap is a separate stylesheet on a CDN, so it does not follow the
     page's own tokens — it has to be told. isDark() already reads the attribute
     first and the media query second, so this is right in all three states. */
  if(MAP) MAP.setStyle(BASEMAP[isDark()?'dark':'light']);
});
syncThemeBtn();
</script>
