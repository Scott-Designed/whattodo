<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type — Notice</title>
<script>
try{var t=localStorage.getItem('notice.theme');
    if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
</script>
<link rel="stylesheet" href="/sunset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/notice-page.css">
<link rel="stylesheet" href="/notice-nav.css">
</head>
<body data-nav="type">
<script src="/nav.js"></script>

<div class="page">
  <div class="mast">
    <h1 id="title">&nbsp;</h1>
    <p class="stand" id="stand"></p>
  </div>
  <div id="body"></div>
  <div class="kinds" id="kinds"></div>
  <div class="also">
    <h2>Other types</h2>
    <div class="set" id="also"></div>
  </div>
</div>

<script src="/notice-vocab.js"></script>
<script src="/notice-data.js"></script>
<script src="/notice-page.js"></script>
<script>
/* ══ a type ═════════════════════════════════════════════════════════════
   One kind of thing, everywhere it is — broken out by KIND, so the seven
   lists can be read side by side and a row filed wrong is obvious. That is
   the job this page does now: it is a monitoring view for the classification
   first, and a reading view second.

   It used to group by town, which is the better arrangement for a reader and
   the wrong one for checking a classification. The town is still on every row.
   ═══════════════════════════════════════════════════════════════════════ */
const NP = NoticePage, esc = NP.esc;
const ALL_TYPES = PLACE_TYPES.concat(EVENT_TYPES);
const ASKED = NP.subject('type', 't', ALL_TYPES, 'cafe');
const WANT = ASKED.value, KNOWN = WANT !== null;
if(KNOWN) NP.canonical(WANT);
const LABEL = KNOWN ? typeLabel(WANT) : 'Not a type we use';

document.title = LABEL + ' — Notice';
document.getElementById('title').textContent = LABEL;

/* Fixed order, and every kind drawn whether or not it holds anything. A page
   that changes shape depending on what is in it cannot be scanned the same way
   twice, and "shop 0" on /surfing is itself the fact worth seeing. Grouped by
   family, because that is the real structure: places, then people, then the
   two that are neither. */
const KINDS = [
  ['spot','place'], ['venue','place'], ['shop','place'],
  ['group','people'], ['maker','people'],
  ['happening','time'], ['idea','idea']];

/* One line about what the word means here, where the word alone is ambiguous.
   Only the types that genuinely need it — a caption on "Beaches" would be
   filler, and this list is a place a wrong claim could hide. */
const GLOSS = {
  'at-home':'Things that need nothing but your own house and garden.',
  night:'Things that are better, or only possible, after dark.',
  cultural:'Galleries, arts trails and the things a town puts on for itself.',
  community:'Things a group runs and anyone can turn up to.',
  volunteering:'Days out where the point is the work.',
  water:'On the water rather than beside it — paddling, boating, swimming holes.',
  surfing:'The breaks, the comps, and where to buy the gear.',
  nursery:'Plant nurseries and growers open to visitors.',
  shop:'Places you go to buy something, as opposed to a market, which is an event.'};

document.getElementById('also').innerHTML = ALL_TYPES.map(t =>
  `<a href="/${slugify(t)}"${t===WANT?' aria-current="page"':''}>${esc(typeLabel(t))}</a>`).join('');

const body = document.getElementById('body');
const kinds = document.getElementById('kinds');
const stand = document.getElementById('stand');
NP.wireItems(kinds);

(async () => {
  if(!KNOWN){
    body.innerHTML = `<div class="note">The Notice Board has no type called <b>${esc(ASKED.raw)}</b>. `
      + `The ${ALL_TYPES.length} it does use are below.</div>`;
    return;
  }
  body.innerHTML = '<div class="note">Reading the board…</div>';

  const all = await NP.rows();
  if(!all){
    body.innerHTML = '<div class="note">Could not reach the database, so this page has '
      + 'nothing to show. The <a href="/">Notice Board</a> ships with a copy of the '
      + 'listings built into it and will still work.</div>';
    return;
  }

  /* typesOf, not `type`: a film festival is a festival AND a cinema thing, and
     a type that is only ever a row's second one would otherwise have an empty
     page. */
  const mine = all.filter(i => typesOf(i).includes(WANT));
  const towns = new Set(mine.map(i => suburbOf(i.loc)).filter(Boolean));

  stand.innerHTML = mine.length
    ? `<b>${NP.n(mine.length,'thing','things')}</b> on the board`
      + `${towns.size > 1 ? `, across ${NP.n(towns.size,'town','towns')}` : ''}.`
      + (GLOSS[WANT] ? ' ' + GLOSS[WANT] : '')
    : `Nothing on the board is filed as ${esc(LABEL.toLowerCase())} yet.`;

  body.innerHTML = '';
  if(!mine.length){
    body.innerHTML = `<div class="note">${esc(LABEL)} is one of the ${ALL_TYPES.length} types `
      + `the database uses, but nothing carries it yet.</div>`;
    return;
  }

  /* A row with no kind is not filed anywhere yet, and on a page whose job is
     to show how things are filed that is the most important row on it — so it
     gets its own section rather than being quietly dropped. */
  const unfiled = mine.filter(i => !i.kind);

  /* Every bucket is the same fixed height and scrolls inside itself, so the
     seven headings line up and the counts can be compared without scrolling.
     The empty state goes INSIDE the scroll box, not beside it, or an empty
     kind would be a different height from a full one and the grid would go
     ragged again. */
  const sec = (k, fam, rows, dated) => `<section class="kindsec${rows.length ? '' : ' empty'}">
      <h2>${esc(k)}<span class="fam">${esc(fam)}</span><span class="n">${rows.length}</span></h2>
      <div class="items">${rows.length
        ? rows.sort(dated ? NP.byDate : NP.byName).map(i => NP.item(i, '', WANT)).join('')
        : '<div class="none">none</div>'}</div>
    </section>`;

  kinds.innerHTML =
    KINDS.map(([k, fam]) => sec(k, fam, mine.filter(i => i.kind === k), k === 'happening')).join('')
    + (unfiled.length ? sec('no kind', 'needs a person', unfiled, false) : '');
})();
</script>
</body>
</html>
